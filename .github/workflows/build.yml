jobs:
  example-job:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./scripts/
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build kernel
        run: ./build-kernel.sh
      - name: Make bootstrap
        run: ./base-bootstrap.sh
      - name: Make image
        run: ./build-image-final.sh
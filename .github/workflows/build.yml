name: Build x86_64

on:
  workflow_dispatch: {}

  schedule:
    - cron: "21 3 * * 6"

jobs:
  example-job:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./scripts/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential flex bison libssl-dev libelf-dev dwarves pahole rsync bc kmod cpio libncurses-dev wget debootstrap

      - name: Allow exec on kernel
        run: chmod +x build-kernel.sh 

      - name: Build kernel
        run: ./build-kernel.sh
        
      - name: Allow exec on bootstrap
        run: chmod +x bootstrap-base.sh
        
      - name: Make bootstrap via script
        run: ./bootstrap-base.sh

      - name: Bootstrap manual part
        run: sudo chroot $ROOTFS /bin/bash; cd /root; wget https://cdn.netbsd.org/pub/pkgsrc/pkgsrc-2025Q1.tar.gz; tar -xzf pkgsrc-2025Q1.tar.gz; cd pkgsrc-2025Q1/bootstrap; ./bootstrap --prefix=/usr/pkg; export PATH=/usr/pkg/bin:/usr/pkg/sbin:\$PATH; echo 'export PATH=/usr/pkg/bin:/usr/pkg/sbin:\$PATH' >> /etc/profile; cd /root/pkgsrc-2025Q1/sysutils/systemd; bmake install; ln -sf /usr/pkg/lib/systemd/systemd /sbin/init; /usr/pkg/bin/systemctl enable systemd-journald; echo 'blockD' > /etc/hostname; exit
      
      - name: Allow exec on image build 
        run: chmod +x build-image-final.sh            

      - name: Make image
        run: ./build-image-final.sh

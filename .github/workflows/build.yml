name: Build

on:
    push:
      branches: [ "main" ]
    pull_request:
    workflow_dispatch:

jobs:
  example-job:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./scripts/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential flex bison libssl-dev libelf-dev dwarves pahole rsync bc kmod cpio libncurses-dev wget

      - name: Build kernel
        run: ./build-kernel.sh

      - name: Make bootstrap
        run: ./base-bootstrap.sh

      - name: Make image
        run: ./build-image-final.sh
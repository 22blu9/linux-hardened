name: Build x86_64 busybox

on:
  workflow_dispatch: {}

  schedule:
     - cron: "0 0 * * 3"

jobs:
  example-job:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./scripts/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential flex bison libssl-dev libelf-dev dwarves pahole rsync bc kmod cpio libncurses-dev wget debootstrap

      - name: Allow exec on kernel
        run: chmod +x build-kernel.sh 

      - name: Build kernel
        run: ./build-kernel.sh
        
      - name: Allow exec on bootstrap
        run: chmod +x busybox-bootstrap.sh
        
      - name: Make bootstrap via script
        run: ./busybox-bootstrap.sh

# This is it for now, we have to iron out any and all defects in the scripts.
